<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio de Tratamiento — Grupo Helse</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    padding: 48px 40px 40px;
    width: 100%;
    max-width: 400px;
  }
  .logo-wrap {
    text-align: center;
    margin-bottom: 8px;
  }
  .logo-wrap img { height: 64px; }
  .subtitle {
    text-align: center;
    color: #6b7280;
    font-size: 13px;
    margin-bottom: 32px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    font-weight: 600;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  input {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
    color: #111827;
    margin-bottom: 18px;
    transition: border-color 0.2s;
    outline: none;
  }
  input:focus { border-color: #0303B5; }
  .btn {
    width: 100%;
    padding: 12px;
    background: #0303B5;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 4px;
  }
  .btn:hover { background: #0202a0; }
  .btn:disabled { background: #9ca3af; cursor: not-allowed; }
  .error {
    background: #fef2f2;
    color: #dc2626;
    border-radius: 7px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

  <div class="logo-wrap">

  </div>
  <p class="subtitle">Registro de Entregas de Inicio de Tratamiento</p>
  <div class="error" id="errorMsg"></div>
  <label for="email">Correo electrónico</label>
  <input type="email" id="email" placeholder="usuario@helse.com" autocomplete="email">
  <label for="password">Contraseña</label>
  <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  <button class="btn" id="loginBtn" onclick="doLogin()">Ingresar</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDd4A_zjK_ATHNiT4ZszUxiI0yaJ23B69c",
  authDomain: "inicio-tratamiento.firebaseapp.com",
  projectId: "inicio-tratamiento",
  storageBucket: "inicio-tratamiento.firebasestorage.app",
  messagingSenderId: "272460050530",
  appId: "1:272460050530:web:055247079f3beda38d213b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.doLogin = async function() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('errorMsg');
  err.style.display = 'none';

  if (!email || !password) {
    err.textContent = 'Completa todos los campos.';
    err.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Verificando...';

  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    const snap = await getDoc(doc(db, 'usuarios', cred.user.uid));
    if (!snap.exists()) throw new Error('Sin perfil');
    const rol = snap.data().rol;
    if (rol === 'visitador') {
      window.location.href = 'gestor.html';
    } else if (rol === 'admin' || rol === 'superadmin') {
      window.location.href = 'admin.html';
    } else {
      throw new Error('Rol no reconocido');
    }
  } catch (e) {
    let msg = 'Correo o contraseña incorrectos.';
    if (e.message === 'Sin perfil') msg = 'Usuario sin perfil asignado. Contacte al administrador.';
    if (e.message === 'Rol no reconocido') msg = 'Rol no reconocido.';
    err.textContent = msg;
    err.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = 'Ingresar';
  }
};

document.addEventListener('keydown', e => { if (e.key === 'Enter') window.doLogin(); });
</script>
</body>
</html>
